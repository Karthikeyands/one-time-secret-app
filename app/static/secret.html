<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Secret — OneTimeSecret</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <span class="logo-text">OneTimeSecret</span>
    </div>

    <h1>You've received a secret</h1>
    <p class="subtitle">This message is encrypted and will be gone forever the moment you reveal it. Make sure you're ready.</p>

    <div id="formSection">
      <div class="field">
        <label for="password">Password (if required)</label>
        <input type="password" id="password" placeholder="Leave blank if no password was set" />
      </div>
      <button id="revealBtn" onclick="revealSecret()">Reveal secret</button>
    </div>

    <div class="secret-reveal" id="secretReveal">
      <div class="result-label">Your secret</div>
      <div class="secret-text" id="secretText"></div>
      <p class="secret-note">This secret has been permanently deleted from the server.</p>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    const secretId = window.location.pathname.split('/secret/')[1];
    const errorBox = document.getElementById('errorBox');
    const revealBtn = document.getElementById('revealBtn');

    if (!secretId) showError('Invalid secret URL.');

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') revealSecret();
    });

    async function revealSecret() {
      errorBox.classList.remove('show');
      revealBtn.disabled = true;
      revealBtn.textContent = 'Decrypting...';

      try {
        const res = await fetch('/secret/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret_id: secretId,
            password: document.getElementById('password').value || '',
          }),
        });

        const data = await res.json();

        if (res.status === 404) return showError('This secret does not exist or has already been viewed.');
        if (res.status === 410) return showError('This secret has expired and been permanently deleted.');
        if (res.status === 403) return showError('Incorrect password. Please try again.');
        if (!res.ok) return showError(data.detail || 'Something went wrong.');

        document.getElementById('formSection').style.display = 'none';
        document.getElementById('secretText').textContent = data.secret;
        document.getElementById('secretReveal').classList.add('show');
      } catch (err) {
        showError('Network error. Please check your connection and try again.');
      } finally {
        revealBtn.disabled = false;
        revealBtn.textContent = 'Reveal secret';
      }
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      revealBtn.disabled = false;
      revealBtn.textContent = 'Reveal secret';
    }
  </script>
</body>
</html>
